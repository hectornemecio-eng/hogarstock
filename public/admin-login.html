<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <title>HogarStock · Acceso administrativo</title>
 <link rel="stylesheet" href="/hogarstock-ui.css">

</head>
<body class="page-login">
<main>
 <div class="brand">
   <span class="brand-mark" aria-hidden="true">HS</span>
   <span><span class="brand-name">HogarStock</span><span class="brand-caption">Inventario compartido</span></span>
 </div>
 <p class="eyebrow">Acceso privado</p>
 <h1 class="login-title">Bienvenido de nuevo</h1>
 <p class="login-caption">Accede al inventario del hogar y gestiona tus listas compartidas.</p>
 <form id="login">
   <label for="password">Contraseña de administrador</label>
   <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200"
          placeholder="Introduce tu contraseña">
   <button type="submit" id="boton">Entrar a HogarStock</button>
 </form>
 <p id="estado" role="status" aria-live="polite"></p>
 <p class="login-foot">Tu inventario, tus contactos, tu espacio privado.</p>
</main>
<script>
"use strict";
document.getElementById("login").addEventListener("submit",async(event)=>{
 event.preventDefault();
 const boton=document.getElementById("boton"),estado=document.getElementById("estado");
 const campo=document.getElementById("password");
 boton.disabled=true;estado.textContent="Verificando...";
 try{
  const response=await fetch("/api/admin/login",{
   method:"POST",headers:{"Content-Type":"application/json"},
   credentials:"same-origin",cache:"no-store",body:JSON.stringify({password:campo.value})
  });
  campo.value="";
  if(!response.ok){estado.textContent=response.status===429?"Demasiados intentos. Reintenta más tarde.":"Acceso no autorizado.";return;}
  location.replace("/");
 }catch(_){estado.textContent="Error de conexión o sesión.";}
 finally{boton.disabled=false;}
});
</script>
</body></html>
