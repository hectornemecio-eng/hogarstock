name: HogarStock V2 - exports Baileys RC11 reales
on:
  push:
    branches: [laboratorio-v370-libsql-2026-11-09]
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11.0', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7060b27ef18de9de73091be3963e3c37cc2db246
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Instalar solo Baileys sin conectarse a WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hs-baileys-qa
          printf '{"name":"baileys-qa","private":true,"version":"1.0.0"}\n' > /tmp/hs-baileys-qa/package.json
          npm install --prefix /tmp/hs-baileys-qa --ignore-scripts --no-audit --no-fund --save-exact @whiskeysockets/baileys@7.0.0-rc11
          cd /tmp/hs-baileys-qa
          node --input-type=module - <<'JS'
          import * as mod from '@whiskeysockets/baileys';
          const expected=['default','initAuthCreds','BufferJSON','proto','fetchLatestWaWebVersion'];
          const missing=expected.filter(k=>k==='BufferJSON'?
            typeof mod.BufferJSON?.replacer!=='function'||typeof mod.BufferJSON?.reviver!=='function':
            k==='proto'?!mod.proto:k==='default'||k==='initAuthCreds'||k==='fetchLatestWaWebVersion'?typeof mod[k]!=='function':!mod[k]);
          console.log('NODE_VERSION='+process.version);
          console.log('BAILEYS_EXPORTS='+expected.map(k=>k+':'+(missing.includes(k)?'FAIL':'OK')).join(','));
          if(missing.length)process.exit(1);
          console.log('RESULTADO_BAILEYS_RC11=CORRECTO');
          JS
