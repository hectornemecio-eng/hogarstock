name: HogarStock - dependencia QR local auditada
on:
  push:
    branches: [laboratorio-v2-runtime-2026-11-09]
permissions:
  contents: read
jobs:
  recurso-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7060b27ef18de9de73091be3963e3c37cc2db246
          persist-credentials: false
      - name: Descargar distribucion QR de version fija sin ejecutarla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artefacto-qr
          cd artefacto-qr
          npm pack qrcodejs@1.0.0 --ignore-scripts --pack-destination .
          tar -tzf qrcodejs-1.0.0.tgz | grep -F 'package/qrcode.min.js'
          tar -xzf qrcodejs-1.0.0.tgz package/qrcode.min.js package/LICENSE
          mv package/qrcode.min.js qrcode.min.js
          mv package/LICENSE LICENSE
          rm -rf package qrcodejs-1.0.0.tgz
          test -s qrcode.min.js
          sha256sum qrcode.min.js LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: qrcodejs-1-0-0-local
          path: artefacto-qr/
          if-no-files-found: error
          retention-days: 1
