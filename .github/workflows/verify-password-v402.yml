name: HogarStock v4.02 - cambio de clave seguro
on:
  push:
    branches: [password-change-v402-2026-11-10]
permissions:
  contents: read
jobs:
  security-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias sin scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis del servidor y seguridad
        run: |
          node --check server.js
          node --check security/v2-identity.js
          node --check security/v2-http.js
          node --check security/v2-password-store.js
          node --check tests/password-change-v402.test.js
      - name: Prueba de contraseña, aislamiento y regresión
        run: node --test tests/*.test.js
      - name: Comprobar ausencia de credenciales de producción
        run: |
          test ! -f .env
          test ! -f auth.json
