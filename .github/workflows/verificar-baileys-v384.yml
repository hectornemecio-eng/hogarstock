name: HogarStock - seguridad Baileys 7.0.0-rc12
on:
  push:
    branches: [preparacion-hogarstock-v383]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Fijar dependencia corregida y reproducibilidad
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');if(p.dependencies['@whiskeysockets/baileys']!=='7.0.0-rc12')process.exit(2)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --check server.js
          node PRUEBA_COMPATIBILIDAD_V383.cjs
          node --input-type=module -e "const b=await import('@whiskeysockets/baileys');if(typeof b.default!=='function'||typeof b.initAuthCreds!=='function'||typeof b.fetchLatestWaWebVersion!=='function')process.exit(2);console.log('BAILEYS_RC12_IMPORT=OK')"
          npm audit --omit=dev --audit-level=critical
      - name: Guardar lockfile reparado en rama de preparacion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HogarStock CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: lockfile de Baileys rc12 sin vulnerabilidad critica conocida'
            git push origin HEAD:preparacion-hogarstock-v383
          fi
