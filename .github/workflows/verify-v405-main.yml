name: HogarStock - regresion v4.05 y solicitudes a main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar sintaxis
        run: |
          node --check server.js
          node --check security/v2-grants.js
          node --check catalogo/gestion-v404.js
          node --check whatsapp/wa-auth-turso.js
      - name: Regresiones completas, incluida v4.05
        run: node --test tests/*.test.js
      - name: Impedir artefactos de credenciales obvios
        run: |
          test ! -f .env
          test ! -f auth.json
          test ! -f respaldo.hsbk
          test ! -f claves.hskeys
