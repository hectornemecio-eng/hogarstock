name: HogarStock - pruebas SQLite aisladas

on:
  push:
    branches:
      - seguridad-pruebas-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-db:
    name: Validacion de inicializacion db.js
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar sintaxis
        run: |
          node --check db.js
          node --check tests/db-sqlite.test.js

      - name: Comprobar sintaxis del modulo de seguridad
        run: |
          node --check security/access.js
          node --check tests/access.test.js
          node --check security/store.js
          node --check tests/store.test.js
          node --check security/http-prototype.js
          node --check tests/http-prototype.test.js
          node --check compras/conciliacion.js
          node --check tests/conciliacion.test.js
          node --check api/v3-router.js
          node --check tests/v3-router.test.js
          node --check security/buyer-sessions.js
          node --check tests/buyer-sessions.test.js
          node --check tests/comprador-v3-static.test.js
          node --check compras/store.js
          node --check tests/compras.test.js
          node --check catalogo/store.js
          node --check tests/catalogo.test.js
          node --check tests/admin-v3.test.js
          node --check integration/v3-sandbox-server.js
          node --check tests/v3-browser-e2e.test.js
          node --check tests/v3-boundary.test.js
          node --check tests/ui-javascript.test.js

      - name: Ejecutar pruebas aisladas SQLite y autorizacion
        run: node --test tests/db-sqlite.test.js tests/access.test.js tests/store.test.js tests/http-prototype.test.js tests/compras.test.js tests/conciliacion.test.js tests/comprador-v3-static.test.js tests/catalogo.test.js tests/ui-javascript.test.js

      - name: Validar sintaxis de integracion libSQL
        run: node --check tests/libsql-real.test.js

      - name: Instalar solo libSQL de pruebas fuera del proyecto
        run: |
          mkdir -p "$RUNNER_TEMP/hogarstock-libsql-test"
          npm install --prefix "$RUNNER_TEMP/hogarstock-libsql-test" --no-save --package-lock=false --ignore-scripts @libsql/client@0.14.0

      - name: Instalar Express solo para pruebas en el entorno temporal
        run: npm install --prefix "$RUNNER_TEMP/hogarstock-libsql-test" --no-save --package-lock=false --ignore-scripts @libsql/client@0.14.0 express@4.21.2

      - name: Ejecutar tests con cliente libSQL real y archivo local
        env:
          NODE_PATH: ${{ runner.temp }}/hogarstock-libsql-test/node_modules
        run: node --test tests/libsql-real.test.js

      - name: Ejecutar integracion HTTP V3 con Express y libSQL locales
        env:
          NODE_PATH: ${{ runner.temp }}/hogarstock-libsql-test/node_modules
        run: node --test tests/v3-router.test.js tests/buyer-sessions.test.js tests/admin-v3.test.js

      - name: Preparar navegador Chromium exclusivamente para E2E local
        run: |
          npm install --prefix "$RUNNER_TEMP/hogarstock-libsql-test" --no-save --package-lock=false --ignore-scripts @libsql/client@0.14.0 express@4.21.2 playwright@1.56.1
          "$RUNNER_TEMP/hogarstock-libsql-test/node_modules/.bin/playwright" install chromium

      - name: Crear certificado TLS efimero para loopback
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$RUNNER_TEMP/hogarstock-test.key" \
            -out "$RUNNER_TEMP/hogarstock-test.crt" \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
          chmod 600 "$RUNNER_TEMP/hogarstock-test.key"

      - name: Recorrido completo en Chromium HTTPS local
        env:
          NODE_PATH: ${{ runner.temp }}/hogarstock-libsql-test/node_modules
          HOGARSTOCK_V3_SANDBOX: "1"
          HOGARSTOCK_SANDBOX_CERT: ${{ runner.temp }}/hogarstock-test.crt
          HOGARSTOCK_SANDBOX_KEY: ${{ runner.temp }}/hogarstock-test.key
        run: node --test tests/v3-browser-e2e.test.js tests/v3-boundary.test.js
